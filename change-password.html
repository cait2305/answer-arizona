<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password | Answer Arizona</title>
  <style>
    :root { --navy: #123b5d; --teal: #138a8f; --ink: #1d3442; --line: #d2e0e5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #eef5f5; color: var(--ink); font: 16px/1.5 Arial, sans-serif; }
    main { width: min(100%, 520px); padding: 32px; background: #fff; border-top: 6px solid var(--teal); box-shadow: 0 8px 24px rgba(18, 59, 93, .12); }
    h1 { margin: 0 0 10px; color: var(--navy); }
    p { color: #536b78; }
    label { display: block; margin-top: 20px; font-weight: bold; }
    input { display: block; width: 100%; margin-top: 6px; padding: 11px; border: 1px solid var(--line); font: inherit; }
    button { margin-top: 22px; padding: 11px 18px; border: 0; background: var(--teal); color: #fff; cursor: pointer; font: inherit; }
    button:disabled { opacity: .6; cursor: wait; }
    #status, #message { margin-top: 18px; }
    .error { color: #a33a3a; }
    .success { color: #287657; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <h1>Change Password</h1>
    <p id="status">Checking your recovery link...</p>

    <form id="passwordForm" hidden>
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
      <button id="submitButton" type="submit">Update password</button>
    </form>

    <p id="message" aria-live="polite"></p>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://ztgyjywfbaogvclqptfn.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "PASTE_NEW_PUBLISHABLE_KEY_HERE";
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: true, detectSessionInUrl: true }
    });

    const statusElement = document.getElementById("status");
    const formElement = document.getElementById("passwordForm");
    const messageElement = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    supabaseClient.auth.onAuthStateChange(function (event) {
      if (event === "PASSWORD_RECOVERY") {
        statusElement.textContent = "Recovery verified. Set a new password below.";
        formElement.hidden = false;
      }
    });

    async function initialize() {
      if (SUPABASE_PUBLISHABLE_KEY === "PASTE_NEW_PUBLISHABLE_KEY_HERE") {
        statusElement.textContent = "Add the Supabase publishable key to this file before uploading it.";
        statusElement.className = "error";
        return;
      }

      const result = await supabaseClient.auth.getSession();
      if (result.error) {
        statusElement.textContent = "Could not read the recovery link.";
        statusElement.className = "error";
        return;
      }

      if (result.data.session) {
        statusElement.textContent = "Recovery verified. Set a new password below.";
        formElement.hidden = false;
      } else {
        statusElement.textContent = "This recovery link is invalid or expired. Request a new one.";
        statusElement.className = "error";
      }
    }

    formElement.addEventListener("submit", async function (event) {
      event.preventDefault();
      messageElement.textContent = "";
      messageElement.className = "";
      submitButton.disabled = true;

      const newPassword = document.getElementById("newPassword").value;
      const result = await supabaseClient.auth.updateUser({ password: newPassword });

      submitButton.disabled = false;
      if (result.error) {
        messageElement.textContent = "Update failed: " + result.error.message;
        messageElement.className = "error";
        return;
      }

      messageElement.textContent = "Password updated successfully. You can now return to the website and sign in.";
      messageElement.className = "success";
      formElement.reset();
    });

    initialize();
  </script>
</body>
</html>
