<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Handling Prescription Matters — Interactive Narrated Module</title><style>
:root{--navy:#1b3452;--bg:#eef2f6;--card:#fff;--text:#17202a;--muted:#66717f;--green:#087830;--red:#a51d1d;--line:#d7dde5;--gold:#9a6800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text)}
.wrap{max-width:1050px;margin:auto;padding:20px}.top{background:var(--navy);color:#fff;padding:18px 22px;border-radius:16px 16px 0 0}
.top h1{margin:0 0 6px;font-size:clamp(24px,4vw,36px)}.top p{margin:0;opacity:.9}
.progress-shell{height:10px;background:#dbe1e8;border-radius:999px;overflow:hidden;margin:18px 0 8px}.progress{height:100%;width:0;background:#526b86;transition:width .25s}
.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px;margin-bottom:14px;flex-wrap:wrap}
.card{background:var(--card);border-radius:16px;padding:24px;border:1px solid var(--line)}h2{margin-top:0;font-size:clamp(22px,3vw,30px)}
.visual{min-height:270px;border-radius:14px;background:linear-gradient(145deg,#f7f9fb,#e9eff4);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:25px;text-align:center}
.visual-inner{max-width:820px}.visual .kicker{font-size:14px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:bold}.visual .big{font-size:clamp(28px,5vw,52px);line-height:1.08;color:var(--navy);font-weight:800;margin:18px 0}.visual .sub{color:var(--muted);font-size:16px}
.audio-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px;padding:12px;background:#f6f8fa;border:1px solid var(--line);border-radius:11px}
.audio-row audio{flex:1;min-width:240px}.hint{color:var(--muted);font-size:14px;margin:8px 0 0}
.answers{display:grid;gap:12px;margin:20px 0}.answer{width:100%;min-height:52px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:13px 15px;font-size:17px;cursor:pointer}
.answer:hover{border-color:#8fa0b2}.answer:focus,.continue:focus{outline:3px solid #9eb6cf;outline-offset:2px}.answer.correct{border-color:var(--green);background:#eff9f2}.answer.wrong{border-color:var(--red);background:#fff1f1}
.feedback{min-height:28px;font-weight:bold;margin:10px 0}.feedback.ok{color:var(--green)}.feedback.bad{color:var(--red)}
.continue,.restart{border:0;border-radius:10px;background:var(--navy);color:#fff;padding:13px 22px;font-size:17px;font-weight:bold;cursor:pointer;min-height:48px}.continue[disabled]{opacity:.4;cursor:not-allowed}
.complete{text-align:center;padding:28px}.score{font-size:52px;font-weight:bold;color:var(--navy);margin:10px 0}.small{font-size:14px;color:var(--muted)}
.notice{padding:12px 14px;border-left:5px solid var(--gold);background:#fff8e8;border-radius:8px;margin-bottom:18px}
@media(max-width:600px){.wrap{padding:10px}.card{padding:17px}.visual{min-height:220px}}
</style></head>

 }
 else if(s.type==='quiz'){
   const q=document.createElement('p');q.textContent=s.question;q.style.fontSize='19px';stage.append(q);
   const note=document.createElement('p');note.className='hint';note.textContent='Select the correct answer to continue.';stage.append(note);
   const box=document.createElement('div');box.className='answers';
   const fb=document.createElement('div');fb.className='feedback';
   const cont=button('Continue',true);
   s.choices.forEach((opt,i)=>{
     const b=document.createElement('button');b.type='button';b.className='answer';b.textContent=opt;
     b.addEventListener('click',()=>{
       if(!cont.disabled)return;
       box.querySelectorAll('button').forEach(x=>x.classList.remove('wrong'));
       if(i===s.answer){
         b.classList.add('correct');fb.textContent=s.correct;fb.className='feedback ok';
         correctCount++;answeredChecks++;cont.disabled=false;box.querySelectorAll('button').forEach(x=>x.disabled=true);updateMeta();cont.focus();
       }else{b.classList.add('wrong');fb.textContent='Not quite. Review the lesson and try again.';fb.className='feedback bad';}
     });
     box.append(b);
   });
   stage.append(box,fb,cont);
 }
 else{
   document.getElementById('progress').style.width='100%';
   const div=document.createElement('div');div.className='complete';
   div.innerHTML='<p>You completed all required narrated sections and interactive checkpoints.</p><div class="score">✓</div><p><strong>'+correctCount+' / '+answeredChecks+'</strong> checks completed correctly.</p><p class="small">The module does not advance beyond a knowledge check until the learner selects the correct answer.</p>';
   const r=document.createElement('button');r.className='restart';r.textContent='Restart Module';r.onclick=()=>location.reload();div.append(r);stage.append(div);
   renderAckForm(stage);
 }
}
render();
function renderAckForm(container){
 const wrap=document.createElement('div');wrap.style.cssText='max-width:640px;margin:26px auto 0;padding:22px;background:#f6f8fa;border:1px solid var(--line);border-radius:12px;text-align:left';
 wrap.innerHTML='<h2 style="margin-top:0">Acknowledge This Module</h2><p class="hint" style="margin-bottom:16px">Complete this after finishing the lesson above. Your response is emailed to your administrator.</p><label style="display:block;font-weight:bold;margin-bottom:6px">Your full name</label><input type="text" id="ackName" placeholder="First and last name" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-bottom:16px"><label style="display:block;font-weight:bold;margin-bottom:6px">Do you understand this material, or do you need to review it with a trainer?</label><label style="display:flex;align-items:center;gap:8px;font-weight:normal;margin-bottom:8px"><input type="radio" name="ackAnswer" value="I understand this material."> I understand this material</label><label style="display:flex;align-items:center;gap:8px;font-weight:normal;margin-bottom:14px"><input type="radio" name="ackAnswer" value="I need to review this material with a trainer."> I need to review this with a trainer</label><button type="button" class="continue" id="ackSubmitBtn">Submit Acknowledgment</button><p id="ackStatus" style="min-height:24px;font-weight:bold;margin-top:10px"></p>';
 container.append(wrap);
 document.getElementById('ackSubmitBtn').addEventListener('click',function(){
  const name=document.getElementById('ackName').value.trim();
  const selected=wrap.querySelector('input[name="ackAnswer"]:checked');
  const status=document.getElementById('ackStatus');
  status.style.color='';
  if(!name){status.style.color='#a51d1d';status.textContent='Enter your name before submitting.';return;}
  if(!selected){status.style.color='#a51d1d';status.textContent='Select an answer before submitting.';return;}
  status.style.color='';status.textContent='Submitting...';
  window.parent.postMessage({type:'moduleAckSubmit',source:'Prescription_Matters.html',name:name,answer:selected.value},'*');
 });
}
window.addEventListener('message',function(event){
 const data=event.data;
 if(!data||data.type!=='moduleAckResult')return;
 const status=document.getElementById('ackStatus');
 if(!status)return;
 if(data.ok){status.style.color='#087830';status.textContent='Submitted. Thank you, '+data.name+'.';}
 else{status.style.color='#a51d1d';status.textContent=data.error||'Could not send the acknowledgment. Check your connection and try again.';}
});
</script></body></html>
